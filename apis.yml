aid: clicks
name: Clicks
description: >-
  Clicks (Clicks Health) is an AI-native operations company that deploys AI agents to run
  complete healthcare back-office workflows. Its agents handle revenue cycle management
  (eligibility and insurance verification, prior authorization, claim status checking,
  denials management, and patient refunds), patient access, and other repetitive tasks by
  working inside a customer's existing EHR, practice-management, and payer systems either
  through APIs or the same screens staff use. Clicks integrates with major health IT
  platforms including Epic, Cerner, athenahealth, eClinicalWorks, ModMed, NextGen Healthcare,
  and MEDITECH, and states it is SOC 2 Type II audited and HIPAA compliant with end-to-end
  encryption for PHI. Founded in 2025, headquartered in Switzerland, and backed by
  Y Combinator (F2025).
